[project]
name = "smart-weather"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi-mcp>=0.4.0",
    "fastapi[standard]>=0.139.2",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "mcp<2",
    "openai>=3.19.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "tortoise-orm>=1.1.7",
]

[project.scripts]
smart-weather = "app.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
